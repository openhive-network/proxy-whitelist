rewrite ^/whitelist/check$ /rpc/check_url break;
# POST /whitelist/check {"url": "..."} -> "whitelisted"|"blacklisted"|"unknown"

# Legacy individual endpoints (kept for compatibility)
rewrite ^/whitelist/is-whitelisted /rpc/is_whitelisted break;
rewrite ^/whitelist/url-blacklisted /rpc/is_url_blacklisted break;

rewrite ^/whitelist/account-urls /rpc/account_urls break;
# POST /whitelist/account-urls {"account": "..."}

rewrite ^/whitelist/url-accounts /rpc/url_accounts break;
# POST /whitelist/url-accounts {"url": "..."}

rewrite ^/sync-status$ /rpc/sync_status break;
# GET /sync-status -> {"last_block_num": N, "last_block_time": "ISO", "sync_uuid", "stream_schema_version", "stream_sentinel_block"}

rewrite ^/stream/accounts$ /rpc/stream_accounts break;
# GET /stream/accounts?from_block=&to_block=&after_name=&page_size= -> [{"first_block", "hive_id", "name"}]

rewrite ^/stream/urls$ /rpc/stream_urls break;
# GET /stream/urls?from_block=&to_block=&after_md5=&page_size= -> [{"first_block", "md5", "url"}]

rewrite ^/stream/url-authors$ /rpc/stream_url_authors break;
# GET /stream/url-authors?from_block=&to_block=&after_md5=&after_account=&page_size= -> [{"first_block", "url_md5", "account_name"}]

rewrite ^/stream/profiles$ /rpc/stream_profiles break;
# GET /stream/profiles?from_block=&to_block=&after_account=&page_size= -> [{"updated_block", "account_name", "avatar_url", "cover_url"}]

rewrite ^/stream/blacklists$ /rpc/stream_blacklists break;
# GET /stream/blacklists -> {"urls": [...], "accounts": [...]}

rewrite ^/avatar/([^/]+)$ /rpc/avatar?name=$1 break;
# GET /avatar/{name} -> "url" | null, 404 for an unknown account

rewrite ^/cover/([^/]+)$ /rpc/cover?name=$1 break;
# GET /cover/{name} -> "url" | null, 404 for an unknown account

rewrite ^/$ / break;
# endpoint for openapi spec itself

rewrite ^/(.*)$ /rpc/$1 break;
# default endpoint for everything else
