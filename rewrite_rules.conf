rewrite ^/whitelist/check$ /rpc/check_url break;
# POST /whitelist/check {"url": "..."} -> "whitelisted"|"blacklisted"|"unknown"

# Legacy individual endpoints (kept for compatibility)
rewrite ^/whitelist/is-whitelisted /rpc/is_whitelisted break;
rewrite ^/whitelist/url-blacklisted /rpc/is_url_blacklisted break;

rewrite ^/whitelist/account-urls /rpc/account_urls break;
# POST /whitelist/account-urls {"account": "..."}

rewrite ^/whitelist/url-accounts /rpc/url_accounts break;
# POST /whitelist/url-accounts {"url": "..."}

rewrite ^/sync-status$ /rpc/sync_status break;
# GET /sync-status -> {"last_block_num": N, "last_block_time": "ISO"}

rewrite ^/$ / break;
# endpoint for openapi spec itself

rewrite ^/(.*)$ /rpc/$1 break;
# default endpoint for everything else
